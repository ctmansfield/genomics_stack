name: CI
on:
  push: { branches: [ main ] }
  pull_request: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NAS_ROOT: /home/runner/workspace
      REPO_ROOT: ${{ github.workspace }}
      DUCKDB_PATH: /home/runner/workspace/duckdb/genomics.duckdb
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install duckdb
      - name: Prepare dirs
        run: mkdir -p "$NAS_ROOT/duckdb" "$NAS_ROOT/data"
      - name: Run verifies
        run: |
          set -e
          for d in patch_*; do
            if [ -x "$d/verify.sh" ]; then
              echo "== $d =="; bash "$d/verify.sh";
            fi
          done
